<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>我的购物车 - 黑鲨商城</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: Arial, sans-serif; background-color: #f5f5f5; }
        
        /* 导航样式（保留原有） */
        .black-nav { background: #333; padding: 10px 0; }
        .wrap { width: 1226px; margin: 0 auto; display: flex; justify-content: space-between; }
        .black-nav a { color: #b0b0b0; text-decoration: none; margin: 0 8px; }
        .black-nav a:hover { color: #fff; }
        .black-nav ul { display: flex; list-style: none; }
        .black-nav li { display: flex; align-items: center; }
        .black-nav span { color: #b0b0b0; margin: 0 5px; }
        
        .white-nav { background: #fff; padding: 20px 0; border-bottom: 1px solid #eee; }
        .white-nav .wrap { align-items: center; }
        .logo img { height: 40px; }
        .nav-bar a { color: #333; text-decoration: none; margin: 0 15px; }
        .nav-bar a:hover { color: #ff6700; }
        .search { margin-left: auto; }
        .search input { padding: 8px; border: 1px solid #eee; }
        
        /* 购物车主样式 */
        .cart-container { width: 1226px; margin: 30px auto; background: #fff; padding: 20px; }
        
        /* 购物车头部 */
        .cart-header { display: flex; align-items: center; padding: 15px 0; border-bottom: 2px solid #ff6700; }
        .cart-title { font-size: 20px; color: #333; font-weight: bold; }
        .cart-actions { margin-left: auto; }
        .cart-actions a { color: #666; text-decoration: none; margin-left: 20px; }
        .cart-actions a:hover { color: #ff6700; }
        
        /* 购物车列表表头 */
        .cart-list-header { display: flex; background: #f9f9f9; padding: 10px 20px; color: #666; font-size: 14px; }
        .col-check { width: 80px; }
        .col-img { width: 100px; }
        .col-name { flex: 1; }
        .col-spec { width: 180px; }
        .col-price { width: 120px; text-align: center; }
        .col-count { width: 150px; text-align: center; }
        .col-subtotal { width: 120px; text-align: center; }
        .col-op { width: 80px; text-align: center; }
        
        /* 购物车商品项 */
        .cart-item { display: flex; align-items: center; padding: 20px; border-bottom: 1px solid #eee; }
        .cart-item .col-check { text-align: center; }
        .cart-item .col-img img { width: 80px; height: 80px; border: 1px solid #eee; }
        .cart-item .col-name { padding: 0 10px; }
        .cart-item .col-name a { color: #333; text-decoration: none; }
        .cart-item .col-name a:hover { color: #ff6700; }
        .cart-item .col-spec { color: #999; font-size: 12px; }
        .cart-item .col-price { color: #333; font-weight: bold; }
        
        /* 数量操作器 */
        .count-operator { display: inline-flex; align-items: center; border: 1px solid #eee; }
        .count-btn { width: 30px; height: 30px; line-height: 28px; text-align: center; border: none; background: #fff; color: #666; cursor: pointer; }
        .count-btn:hover { background: #f5f5f5; }
        .count-input { width: 50px; height: 30px; line-height: 30px; text-align: center; border: none; border-left: 1px solid #eee; border-right: 1px solid #eee; outline: none; }
        
        .cart-item .col-subtotal { color: #ff6700; font-weight: bold; }
        .cart-item .col-op a { color: #666; text-decoration: none; }
        .cart-item .col-op a:hover { color: #ff6700; }
        
        /* 购物车结算区域 */
        .cart-footer { display: flex; justify-content: space-between; align-items: center; padding: 20px; background: #f9f9f9; margin-top: 20px; }
        .footer-left { display: flex; align-items: center; }
        .all-check { margin-right: 20px; }
        .batch-actions a { color: #666; text-decoration: none; margin-left: 20px; }
        .batch-actions a:hover { color: #ff6700; }
        
        .footer-right { display: flex; align-items: center; }
        .total-info { margin-right: 30px; text-align: right; }
        .total-text { font-size: 14px; color: #666; }
        .total-price { font-size: 20px; color: #ff6700; font-weight: bold; margin-top: 5px; }
        .checkout-btn { width: 180px; height: 50px; background: #ff6700; color: #fff; border: none; cursor: pointer; font-size: 16px; }
        .checkout-btn:hover { background: #f25807; }
        
        /* 空购物车样式 */
        .empty-cart { text-align: center; padding: 80px 0; }
        .empty-icon { font-size: 80px; color: #e0e0e0; margin-bottom: 20px; }
        .empty-text { color: #999; font-size: 16px; margin-bottom: 30px; }
        .go-shop-btn { display: inline-block; padding: 10px 30px; background: #ff6700; color: #fff; text-decoration: none; border-radius: 2px; }
        .go-shop-btn:hover { background: #f25807; }
        
        /* 页脚样式（保留原有） */
        .footer { background: #f5f5f5; padding: 30px 0; text-align: center; margin-top: 30px; }
        .footer a { color: #666; text-decoration: none; margin: 0 10px; }
    </style>
</head>
<body>
    <!-- 导航（保留原有） -->
    <div class="black-nav">
        <div class="wrap">
            <ul>
                <li><a href="#"></a></li>
                <li><a href="#"></a></li>
                <li><a href="#"></a></li>
                <li><a href="#"></a></li>
            </ul>
            <ul>
                <li><a href="index.html" >首页</a><span>|</span></li>
                <li><a href="guanwang.html" >官网</a><span>|</span></li>
                <li><a href="detail1.html" >产品信息</a><span>|</span></li>
                <li><a href="./news.html" >新闻</a><span>|</span></li>
                <li><a href="./register.html" >注册</a><span>|</span></li>
                <li><a href="./detail.html" style="color:#ff6700;">购物车</a></li>
            </ul>
        </div>
    </div>
    
    <div class="white-nav">
        <div class="wrap">
            <div class="logo">
                <img src="img/logo.png" alt="小米logo">
            </div>
            <div class="nav-bar">
                <a href="#">手机</a>
                <a href="#">电视</a>
                <a href="#">笔记本</a>
                <a href="#">平板</a>
            </div>
            <div class="search">
                <input type="text" placeholder="搜索商品">
            </div>
        </div>
    </div>
    
    <!-- 购物车核心区域 -->
    <div class="cart-container">
        <!-- 购物车头部 -->
        <div class="cart-header">
            <div class="cart-title">我的购物车</div>
            <div class="cart-actions">
                <a href="javascript:;" id="refresh-cart">刷新购物车</a>
                <a href="javascript:;" id="clear-cart">清空购物车</a>
            </div>
        </div>

        <!-- 购物车列表 -->
        <div class="cart-list">
            <!-- 列表表头 -->
            <div class="cart-list-header">
                <div class="col-check">勾选</div>
                <div class="col-img">商品图片</div>
                <div class="col-name">商品名称</div>
                <div class="col-spec">规格</div>
                <div class="col-price">单价</div>
                <div class="col-count">数量</div>
                <div class="col-subtotal">小计</div>
                <div class="col-op">操作</div>
            </div>

            <!-- 购物车商品项1 -->
            <div class="cart-item">
                <div class="col-check">
                    <input type="checkbox" class="item-check" checked>
                </div>
                <div class="col-img">
                    <img src="img/meizu1.png" alt="meizu Turbo 3">
                </div>
                <div class="col-name">
                    <a href="meizu-turbo3.html">meizu Turbo 3</a>
                </div>
                <div class="col-spec">
                    极光黑 | 12GB+256GB
                </div>
                <div class="col-price">
                    ¥3599 
                </div>
                <div class="col-count">
                    <div class="count-operator">
                        <button class="count-btn minus">-</button>
                        <input type="text" class="count-input" value="1" min="1">
                        <button class="count-btn plus">+</button>
                    </div>
                </div>
                <div class="col-subtotal">
                    ¥3599 
                </div>
                <div class="col-op">
                    <a href="javascript:;" class="delete-item">删除</a>
                </div>
            </div>

            <!-- 购物车商品项2 -->
            <div class="cart-item">
                <div class="col-check">
                    <input type="checkbox" class="item-check" checked>
                </div>
                <div class="col-img">
                    <img src="img/sj-2.jpg" alt="meizu Turbo 3">
                </div>
                <div class="col-name">
                    <a href="xiaomi14.html">中兴 Civic 4 Pro</a>
                </div>
                <div class="col-spec">
                    黑色 | 12GB+256GB
                </div>
                <div class="col-price">
                    ¥4299
                </div>
                <div class="col-count">
                    <div class="count-operator">
                        <button class="count-btn minus">-</button>
                        <input type="text" class="count-input" value="1" min="1">
                        <button class="count-btn plus">+</button>
                    </div>
                </div>
                <div class="col-subtotal">
                    ¥4299
                </div>
                <div class="col-op">
                    <a href="javascript:;" class="delete-item">删除</a>
                </div>
            </div>
        </div>

        <!-- 购物车结算区域 -->
        <div class="cart-footer">
            <div class="footer-left">
                <div class="all-check">
                    <input type="checkbox" id="all-check" checked>
                    <label for="all-check">全选</label>
                </div>
                <div class="batch-actions">
                    <a href="javascript:;" id="delete-selected">删除选中</a>
                    <a href="index.html">继续购物</a>
                </div>
            </div>
            <div class="footer-right">
                <div class="total-info">
                    <div class="total-text">合计（已选2件商品）：</div>
                    <div class="total-price">¥6298</div>
                </div>
                <button class="checkout-btn" onclick="goToCheckout()">去结算</button>
            </div>
        </div>
    </div>
    
    <!-- 页脚（保留原有） -->
    <div class="footer">
        <a href="#">7天无理由退货</a>
        <a href="#">15天免费换货</a>
        <a href="#">满99元免运费</a>
        <a href="#">售后上门服务</a>
    </div>
    
    <script>
        // 数量增减功能
        document.querySelectorAll('.count-btn').forEach(btn => {
            btn.addEventListener('click', function() {
                const input = this.parentElement.querySelector('.count-input');
                let count = parseInt(input.value);
                const min = parseInt(input.min) || 1;
                
                if (this.classList.contains('plus')) {
                    count++;
                } else {
                    count = count > min ? count - 1 : min;
                }
                
                input.value = count;
                // 更新小计金额
                updateSubtotal(this.closest('.cart-item'));
                // 更新总计金额
                updateTotal();
            });
        });

        // 手动修改数量
        document.querySelectorAll('.count-input').forEach(input => {
            input.addEventListener('change', function() {
                let count = parseInt(this.value);
                const min = parseInt(this.min) || 1;
                
                if (isNaN(count) || count < min) {
                    count = min;
                }
                this.value = count;
                
                // 更新小计金额
                updateSubtotal(this.closest('.cart-item'));
                // 更新总计金额
                updateTotal();
            });
        });

        // 更新单个商品小计
        function updateSubtotal(item) {
            const price = parseFloat(item.querySelector('.col-price').textContent.replace('¥', ''));
            const count = parseInt(item.querySelector('.count-input').value);
            const subtotal = price * count;
            item.querySelector('.col-subtotal').textContent = `¥${subtotal}`;
        }

        // 更新总计金额
        function updateTotal() {
            let total = 0;
            let selectedCount = 0;
            
            // 遍历选中的商品
            document.querySelectorAll('.item-check:checked').forEach(check => {
                const item = check.closest('.cart-item');
                const subtotal = parseFloat(item.querySelector('.col-subtotal').textContent.replace('¥', ''));
                total += subtotal;
                selectedCount++;
            });
            
            // 更新总计显示
            document.querySelector('.total-price').textContent = `¥${total}`;
            document.querySelector('.total-text').textContent = `合计（已选${selectedCount}件商品）：`;
        }

        // 全选功能
        document.getElementById('all-check').addEventListener('change', function() {
            const isChecked = this.checked;
            document.querySelectorAll('.item-check').forEach(check => {
                check.checked = isChecked;
            });
            updateTotal();
        });

        // 单个商品勾选状态改变
        document.querySelectorAll('.item-check').forEach(check => {
            check.addEventListener('change', updateTotal);
        });

        // 删除单个商品
        document.querySelectorAll('.delete-item').forEach(btn => {
            btn.addEventListener('click', function() {
                if (confirm('确定要删除该商品吗？')) {
                    this.closest('.cart-item').remove();
                    updateTotal();
                }
            });
        });

        // 删除选中商品
        document.getElementById('delete-selected').addEventListener('click', function() {
            const selectedItems = document.querySelectorAll('.item-check:checked');
            if (selectedItems.length === 0) {
                alert('请选择要删除的商品');
                return;
            }
            
            if (confirm(`确定要删除选中的${selectedItems.length}件商品吗？`)) {
                selectedItems.forEach(check => {
                    check.closest('.cart-item').remove();
                });
                updateTotal();
            }
        });

        // 清空购物车
        document.getElementById('clear-cart').addEventListener('click', function() {
            if (confirm('确定要清空购物车吗？')) {
                document.querySelectorAll('.cart-item').forEach(item => {
                    item.remove();
                });
                updateTotal();
            }
        });

        // 刷新购物车
        document.getElementById('refresh-cart').addEventListener('click', function() {
            location.reload();
        });

        // 去结算
        function goToCheckout() {
            const selectedCount = document.querySelectorAll('.item-check:checked').length;
            if (selectedCount === 0) {
                alert('请选择要结算的商品');
                return;
            }
            window.location.href = 'deal.html';
        }

        // 初始化总计
        updateTotal();
    </script>
</body>
</html>
