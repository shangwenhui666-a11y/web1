                                    {

                         <p>此次捐赠的平板搭载了定制化的教育系统，内置了丰富的学习资源和护眼模式，专门针对山区学生的学习需求进行了优化。同时，黑鲨科技还将派驻技术人员为学校提供为期1年的设备维护和技术支持。</p>

            },
            {
                id: 7,
                title: "黑鲨科技建成行业首个碳中和研发中心",

                category: "social", // 社会责任

                summary: "黑鲨科技宣布，位于武汉的新研发中心正式投入使用，该中心是游戏硬件行业首个实现碳中和的研发基地，年减碳量达800吨...",
                content: `<p>黑鲨科技宣布，位于武汉的新研发中心正式投入使用，该中心是游戏硬件行业首个实现碳中和的研发基地，年减碳量达800吨。</p>

            }

        // 获取URL参数
        function getUrlParam(name) {
            const reg = new RegExp(`(^|&)${name}=([^&]*)(&|$)`);
            const r = window.location.search.substr(1).match(reg);
            return r ? decodeURIComponent(r[2]) : null;
        }

        // 加载新闻详情
        window.onload = function() {
            const newsId = getUrlParam('id');
            if (newsId) {
                const news = newsData.find(item => item.id === parseInt(newsId));
                if (news) {
                    document.getElementById('detailTitle').textContent = news.title;
                    document.getElementById('detailMeta').innerHTML = 
                        `发布时间：${news.date} | 分类：${getCategoryName(news.category)} | 来源：黑鲨科技官方`;
                    document.getElementById('detailContent').innerHTML = news.content;
                    document.title = news.title + ' - 新闻详情';
                } else {
                    document.getElementById('detailContent').innerHTML = '<p>抱歉，未找到相关新闻</p>';
                }
            } else {
                document.getElementById('detailContent').innerHTML = '<p>请从新闻列表进入详情页</p>';
            }
        };

        // 获取分类名称
        function getCategoryName(category) {
            const categoryMap = {
                'company': '公司动态',
                'product': '产品发布',
                'tech': '技术创新',
                'social': '社会责任'
            };
            return categoryMap[category] || '未知分类';
        }
    </script>
